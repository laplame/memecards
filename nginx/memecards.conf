# MemeCards / Tarjetas.shop — HTTP (80) + HTTPS (443)
# Dominios: tarjetas.shop, www.tarjetas.shop. IP 200.234.228.73 solo HTTP.
#
# Certbot: certificados en /etc/letsencrypt/live/tarjetas.shop/
# Aplicar: ./scripts/nginx-update.sh  luego  sudo nginx -t && sudo systemctl reload nginx

upstream memecards_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream memecards_frontend {
    server 127.0.0.1:5173;
    keepalive 32;
}

# Redirigir HTTP → HTTPS solo para los dominios (tarjetas.shop, www)
server {
    listen 80;
    listen [::]:80;
    server_name tarjetas.shop www.tarjetas.shop;
    return 301 https://$host$request_uri;
}

# HTTP para la IP (sin cert) y proxy a la app
server {
    listen 80;
    listen [::]:80;
    server_name 200.234.228.73;

    access_log /var/log/nginx/memecards-access.log;
    error_log  /var/log/nginx/memecards-error.log;

    client_max_body_size 50M;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location /api/ {
        proxy_pass http://memecards_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_cache_bypass $http_upgrade;
    }
    # ^~ hace que /page/ tenga prioridad y no se use location / por fallback
    location ^~ /page/ {
        proxy_pass http://memecards_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
    location /health {
        proxy_pass http://memecards_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }
    location / {
        proxy_pass http://memecards_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# HTTPS para tarjetas.shop y www.tarjetas.shop (certbot)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tarjetas.shop www.tarjetas.shop;

    ssl_certificate     /etc/letsencrypt/live/tarjetas.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tarjetas.shop/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/memecards-access.log;
    error_log  /var/log/nginx/memecards-error.log;

    client_max_body_size 50M;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location /api/ {
        proxy_pass http://memecards_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_cache_bypass $http_upgrade;
    }
    # ^~ hace que /page/ tenga prioridad y no se use location / por fallback
    location ^~ /page/ {
        proxy_pass http://memecards_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
    location /health {
        proxy_pass http://memecards_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }
    location / {
        proxy_pass http://memecards_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
