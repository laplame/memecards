# MemeCards: frontend (5173) + backend (3000)
# Acceso por IP o por nombre: http://200.234.228.73 o http://efef79cc-0938-42cc-8a5a-43020deccf0c.clouding.host
#
# Instalación en el servidor:
#   sudo cp nginx/memecards.conf /etc/nginx/sites-available/memecards
#   sudo ln -sf /etc/nginx/sites-available/memecards /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Si sigue 502: comprobar que backend y frontend estén en marcha (pm2 status).

# Upstreams para poder ver errores y ajustar timeouts
upstream memecards_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream memecards_frontend {
    server 127.0.0.1:5173;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    # IP del servidor y nombre Clouding (acceso por IP o por dominio)
    server_name 200.234.228.73 efef79cc-0938-42cc-8a5a-43020deccf0c.clouding.host;

    access_log /var/log/nginx/memecards-access.log;
    error_log  /var/log/nginx/memecards-error.log;

    client_max_body_size 50M;

    # Timeouts para evitar 502 si el upstream tarda
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # API y páginas públicas -> backend (puerto 3000)
    location /api/ {
        proxy_pass http://memecards_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_cache_bypass $http_upgrade;
    }

    location /page/ {
        proxy_pass http://memecards_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /health {
        proxy_pass http://memecards_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # SPA -> frontend (puerto 5173)
    location / {
        proxy_pass http://memecards_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
