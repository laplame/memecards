# Nginx: proxy a MemeCards (backend Express)
# El backend sirve la API y el build estático del frontend.
#
# Instalación en el servidor:
#   1. Copiar a sitios disponibles:
#      sudo cp nginx/memecards.conf /etc/nginx/sites-available/memecards
#   2. Activar y recargar:
#      sudo ln -sf /etc/nginx/sites-available/memecards /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
#
# Si cambias BACKEND_PORT en scripts/start-servers.sh, cambia también proxy_pass (ej. 127.0.0.1:4000).

# Redirigir HTTP a HTTPS (opcional; descomenta cuando tengas SSL)
# server {
#     listen 80;
#     server_name efef79cc-0938-42cc-8a5a-43020deccf0c.clouding.host;
#     return 301 https://$server_name$request_uri;
# }

server {
    listen 80;
    # listen 443 ssl;  # descomenta cuando configures SSL
    server_name efef79cc-0938-42cc-8a5a-43020deccf0c.clouding.host;

    # SSL (opcional)
    # ssl_certificate     /etc/ssl/certs/tu-certificado.crt;
    # ssl_certificate_key /etc/ssl/private/tu-clave.key;

    # Logs
    access_log /var/log/nginx/memecards-access.log;
    error_log  /var/log/nginx/memecards-error.log;

    # Tamaño máximo de subida (audio/imágenes)
    client_max_body_size 50M;

    # Proxy todo al backend Node (mismo puerto que BACKEND_PORT en start-servers.sh)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
